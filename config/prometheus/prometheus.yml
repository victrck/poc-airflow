global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'statsd-exporter'
    static_configs:
      - targets: ['statsd-exporter:9102']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  # MinIO cluster metrics exigem bearer token (mc admin prometheus generate).
  # Token abaixo é local/rotacionável; sem ele o target fica 403 (down).
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    bearer_token: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwcm9tZXRoZXVzIiwic3ViIjoibWluaW9hZG1pbiIsImV4cCI6NDk0NTA5MDU1NH0.fyZ37pyAm3qzxn1gQ3F9KNLTI5Ty8ec2p7BJsbbO3uPqB4h3Pig7Wj5GiTAM5gSeBUtroNY4s5IjAj1CBuHOMA
    static_configs:
      - targets: ['minio:9000']
  # Trino OSS 455 não expõe endpoint Prometheus (só JMX); saúde do Trino é
  # observada via queries do smoke (gold.check_silver_meta) e up do container.
